<script>
  (function () {
    var NEW_ROOT = "https://mandy82477.github.io/claude-news/";
    var OLD_PREFIX = "/ObsidianLab/CLAUDE_NEWS/";
    var p = location.pathname;
    var dest;
    if (p.indexOf(OLD_PREFIX) === 0) {
      dest = NEW_ROOT + p.slice(OLD_PREFIX.length);
    } else {
      dest = NEW_ROOT + "web_reader/";
    }
    dest += location.search + location.hash;
    document.getElementById("target").href = dest;
    location.replace(dest);
  })();
</script>
