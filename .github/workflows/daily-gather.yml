# 每日新聞抓取（自動化流水線「階段 ①」）
#
# 這是「GitHub Actions 抓料 + 雲端 routine 做 LLM」分裂架構的第一段。
# 只做純 Python 抓取（不呼叫 LLM、不需 API key），把 gathered_items.json 與
# 去重快取 commit 回 repo，交給雲端 routine（daily-news-pipeline-cloud）接手
# 生成日報 / wiki / 網站。
#
# 為何要在這裡跑而不是雲端 routine：雲端 routine 的沙盒 egress 政策封鎖一般
# 外部網域（Reddit / HN / Google News …回 403），抓不到新聞；GitHub Actions
# runner 網路無限制，且抓取步驟不需 LLM，正好補上缺口。
#
# 手動補救路徑（/news-pipeline）完全不受影響：本檔只是「加上去」的自動路徑。
name: daily-gather

on:
  schedule:
    # 註（2026-08-29）：本檔曾加過一個 00:00 UTC 保險窗，用來對抗 GitHub 排程延遲
    # 10–11 小時導致的下游中止。它被移除，因為那是在**增加生產者**來繞開根因——
    # 根因是下游的緩衝（2.6h）小於這裡的實測變異（11.2h）。改法是把下游 routine
    # 由 13:00 移到 22:00 UTC，緩衝 11.6h，一個數字取代一整班排程。
    # 若哪天「同日送達」變成硬需求，加回 `- cron: "17 0 * * *"` 即可——但要先確認
    # 兩班的**最晚**那班仍蓋得過變異（src/tests/test_daily_gather_schedule.py 會驗）。
    #
    # 分鐘刻意避開整點（2026-08-29）：GitHub 官方文件明載 schedule 事件會在高負載
    # 時延遲，而「每個整點的開始」正是高負載時段，並建議把排程移到整點以外的分鐘。
    # 原本兩班都壓在 :00——尤其 00:00 UTC 是全平台最熱門的 cron 時刻——等於自己
    # 站在最擠的隊伍裡。改為 :17 / :23 不保證解決 10 小時級的延遲（官方事件記錄
    # 顯示 08-27／08-28 的延遲期間並無未結案的 Actions 事件，成因未明），但這是
    # 官方指名的緩解手段且零成本。
    # 10:23 UTC = 18:23 Asia/Taipei，早於雲端 routine（22:00 UTC / 隔日 06:00 台北）
    # 11.6 小時。留足時間讓 commit 推上 repo 供雲端 routine 的新鮮 checkout 讀到。
    # 註：緩衝一路被實測推大——原設計 30 分鐘（12:30 UTC），2026-07-11 實測延遲
    # 1.5–2.7 小時而拉到 3 小時（10:00 UTC）；2026-08-27／08-28 實測延遲 10–11 小時
    # 又穿透，連兩天開天窗，故拉到 11.6 小時。緩衝的唯一判準是「大於實測變異」。
    - cron: "23 10 * * *"

  workflow_dispatch: {}  # 允許手動觸發（測試用）

# 同一時間只跑一個，避免排程與手動觸發重疊造成 push 衝突。
concurrency:
  group: daily-gather
  cancel-in-progress: false

permissions:
  contents: write  # 需要寫入權限把 gathered_items.json / 快取 commit 回 repo

jobs:
  gather:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CLAUDE_NEWS/src
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements_news.txt

      - name: Gather news (Python only, no LLM)
        # GITHUB_TOKEN 是 Actions 每次 run 自帶的臨時 token（額度 1,000 次/小時/repo，
        # 匿名只有 60），config.py 讀同名環境變數，GitHub Issues / releases / Official
        # Skills 三個來源自動帶上；本機執行才需要自己的 PAT。
        # REDDIT_* 未設定時 reddit.py 自動走 RSS 路徑，設定後走 OAuth 拿真實讚數。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: python -m news_aggregator.main --gather-only

      # 把當日抓到的原料存一份按日期分檔的副本。
      #
      # 為什麼需要：gathered_items.json 沒有按日分檔，隔天這個 job 會直接覆寫它。
      # 若某天第 ② 段（雲端 routine）失敗，那天「已經抓到手」的新聞會在隔天 10:00
      # 被覆蓋掉，之後本機補跑只能回頭重抓——但來源多是近期視窗的 RSS/API，
      # 幾天前的內容早已滾出視窗，等於那天的新聞永久漏失。
      #
      # 有了這份副本，補跑可以直接replay當天的真實原料（見 news-pipeline-steps.md
      # 的「補跑（backfill）注意事項」），補得回來且與原本會產出的內容一致。
      # 保留 14 天，與 emitted-cache 的 TTL 一致。
      # 實作在 scripts/archive_gathered.py（本機 Step 1a 呼叫同一支，行為一致）
      - name: Archive today's gathered items (for backfill replay)
        working-directory: CLAUDE_NEWS
        run: python scripts/archive_gathered.py

      - name: Commit gathered data + dedup caches
        working-directory: .  # repo root
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CLAUDE_NEWS/src/gathered_items.json \
                  CLAUDE_NEWS/src/gathered_archive \
                  CLAUDE_NEWS/src/news_aggregator/emitted_items.json \
                  CLAUDE_NEWS/src/news_aggregator/seen_urls.json \
                  CLAUDE_NEWS/src/news_aggregator/sources/official_watch_state.json \
                  CLAUDE_NEWS/src/news_aggregator/sources/official_skills_repos_state.json \
                  CLAUDE_NEWS/data/source_funnel.jsonl
          # 兩個 *_state.json 是清冊型來源（Official Docs / Official Skills）的
          # 「上次看到的樣子」。不 commit → 每次全新 checkout 都拿 repo 舊基線比對，
          # 同一筆異動天天重複偵測，且 state 只有本機手動跑才會前進（2026-08-15 發現：
          # 08-13 已把 state 納入版控，但此處漏加，等於只做了一半）。
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "data: daily gather $(date -u +%F) (GH Actions)"
            # 推送前必須 rebase 重試（2026-08-29 加入）。原本是裸 `git push`：
            # checkout 到 push 之間約有 2 分鐘視窗，期間若雲端 routine 或使用者
            # 本機推了任何 commit，push 就 non-fast-forward 失敗 → job 失敗 →
            # **當天的抓料整包不落地**，而失敗原因看起來像抓取有問題。
            for attempt in 1 2 3; do
              if git push; then
                echo "Pushed gathered data for $(date -u +%F) (attempt $attempt)."
                exit 0
              fi
              echo "Push rejected (attempt $attempt), rebasing onto origin/master…"
              git pull --rebase origin master
            done
            echo "::error::Push failed after 3 attempts — 今日抓料未落地"
            exit 1
          fi
